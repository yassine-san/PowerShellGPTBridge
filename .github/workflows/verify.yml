name: Build and verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  CARGO_BUILD_JOBS: 2
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 8.0.428
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.14.0
      - name: Rust
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev xvfb xdotool imagemagick
      - name: Linux publish
        if: runner.os == 'Linux'
        run: ./Build-Linux.sh
      - name: Windows publish (both presentations)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./Build.ps1
          ./Build-Desktop.ps1
      - name: Test shared enforcement, evidence and worker persistence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          dotnet run --project Tests/Supervision
          dotnet build Tests/Session
          $rid = if ($IsWindows) {'win'} else {'unix'}
          $env:PSModulePath = Join-Path $PWD "Tests/Session/bin/Debug/net8.0/runtimes/$rid/lib/net8.0/Modules"
          dotnet run --no-build --project Tests/Session -- --measure
          dotnet build Tests/Core
          $env:PSModulePath = Join-Path $PWD "Tests/Core/bin/Debug/net8.0/runtimes/$rid/lib/net8.0/Modules"
          dotnet run --no-build --project Tests/Core
          dotnet build Tests/Protocol
          python Tests/Protocol/check.py
          python Tests/Protocol/check.py dotnet clock-expiry
          python Tests/Protocol/check.py dotnet late-approval
      - name: Capture native Linux fixture windows
        if: runner.os == 'Linux'
        run: xvfb-run -a -s '-screen 0 1440x1000x24' bash scripts/capture-fixture.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: runner.os == 'Linux'
        with:
          name: native-linux-fixture-screenshots
          path: screenshots/*.png
          if-no-files-found: error
